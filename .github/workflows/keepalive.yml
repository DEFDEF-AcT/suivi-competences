# Le projet Supabase gratuit se met en pause après 7 jours sans activité (vacances scolaires).
# Cet appel automatique, deux fois par semaine, le garde actif. Il ne lit aucune donnée.
name: Maintien en activité de la base
on:
  schedule:
    - cron: '17 6 * * 1,4'   # lundi et jeudi, 6 h 17 UTC
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel de la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://hkjzjpxsnmfifrwvtdqe.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_tS4Ib5VRdAX-f753b_vURw_NLSy9_Dk" \
            -H "Content-Type: application/json" -d '{}')
          echo "Réponse : $code"
          test "$code" = "200"
